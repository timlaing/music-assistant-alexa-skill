{% macro banner(title, description, kind='good') %}
<div class="ma-banner" data-kind="{{ kind }}" role="status" aria-live="polite">
  <span class="ma-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
  <div><strong>{{ title }}</strong><p>{{ description }}</p></div>
</div>
{% endmacro %}
