<style>body{font:17px system-ui;background:#f4f6f8;color:#17212b;margin:0}main{box-sizing:border-box;max-width:780px;margin:32px auto;padding:28px;background:white;border-radius:12px}h1{font-size:28px}section{border-top:1px solid #ddd;margin-top:24px;padding-top:16px}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:10px;max-width:100%}input:not([type=checkbox]),select{width:100%;box-sizing:border-box}small{display:block;color:#53616d}button{cursor:pointer;background:#115d93;color:white;border:0;border-radius:6px;margin:8px 8px 8px 0}button:disabled{opacity:.5;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f8;padding:12px}#message:not([hidden]),.notice{padding:12px;background:#edf5fc;display:block}#certificateSaved{display:block}.notice.success{background:#e7f5eb;color:#176b35;border-left:4px solid #218443}a{color:#115d93}dt{font-weight:600;margin-top:10px}dd{margin-left:0;overflow-wrap:anywhere}html [hidden]{display:none}</style>
<style>body{overflow-wrap:anywhere}.row{margin:16px 0}.muted{color:#53616d;font-size:.9em}.led{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px}.green{background:#2ecc71}.yellow{background:#f1c40f}.red{background:#e74c3c}.intent-toggle{background:transparent;color:#115d93;padding:0}.status-box:focus{outline:2px solid #115d93;outline-offset:2px}@media(max-width:600px){main{margin:0;padding:20px;border-radius:0}}</style>
<style>.stepper{display:flex;flex-wrap:wrap;gap:8px 18px;margin:16px 0}.step{display:inline-flex;align-items:center;text-decoration:none;color:#17212b;border-bottom:2px solid transparent;padding-bottom:2px}.step.current{border-color:#00a4e3;font-weight:600}audio{width:100%;margin:4px 0}output#saved{display:inline;margin-left:8px}.step-nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}</style>
