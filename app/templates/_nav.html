<header class="ma-top">
  <a class="ma-brand" href="/status">
    <img class="ma-app-icon" src="/assets/app-icon.png" width="36" height="36" alt="" />
    <span><strong>Music Assistant</strong><span class="ma-subbrand">Alexa integration</span></span>
  </a>
  <button class="ma-button ma-menu" type="button" aria-expanded="false" aria-controls="main-navigation">Menu</button>
  <nav class="ma-nav" id="main-navigation" aria-label="Main navigation">
    {% for key, label in nav_items %}
    <a href="/{{ key }}"{% if key == current %} aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
</header>
