[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
# The pre-expansion ruff defaults, made explicit so `ruff check` stays
# deterministic across ruff releases.
select = [
    "E4",  # pycodestyle errors (imports)
    "E7",  # pycodestyle errors (misc)
    "E9",  # pycodestyle errors (runtime)
    "F",   # pyflakes
]
