name: Build and Push Docker image to GHCR

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/docker-ghcr.yml"
      - "app/**"
    tags:
      - "v*"
  # Releases are cut by publishing a GitHub release; building from the
  # release event guarantees the image carries the release tag (v1.3.5 …)
  # even when the tag was created by the release itself.
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/docker-ghcr.yml"
      - "app/**"
  # Backfill a release tag onto an already-built image, e.g. after enabling
  # this workflow: gh workflow run docker-ghcr.yml -f image_tag=v1.3.5
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra raw image tag to apply (release tag to backfill)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  # Keyless (Fulcio) cosign signing of pushed images, so the add-on can
  # verify the base image signature before building from it.
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/music-assistant-skill

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login only when we push (not on PR)
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Release tags (v1.3.5 / 1.3.5) come from the pushed tag or the
          # published release; latest is added by the action for stable
          # releases only. Branch pushes get edge + sha-… instead, so they
          # never overwrite a release tag.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Build (PR) - no push
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push (push/release/workflow_dispatch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the pushed multi-arch manifest (and its per-arch children)
      # keyless via Fulcio. Consumers — the music-assistant-alexa-api
      # add-on build — verify with:
      #   cosign-issuer:   https://token.actions.githubusercontent.com
      #   cosign-identity: https://github.com/timlaing/music-assistant-alexa-skill/.*
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      - name: Sign pushed images
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # All generated tags point at the same manifest; sign it once by digest.
          ref="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
          echo "Signing $ref@$digest"
          cosign sign --yes --recursive "$ref@$digest"
