name: Build and Push Docker image to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-ghcr.yml'
      - 'app/**'
    tags:
      - 'v*'
  # Releases are cut by publishing a GitHub release; building from the
  # release event guarantees the image carries the release tag (v1.3.5 …)
  # even when the tag was created by the release itself.
  release:
    types: [ published ]
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-ghcr.yml'
      - 'app/**'
  # Backfill a release tag onto an already-built image, e.g. after enabling
  # this workflow: gh workflow run docker-ghcr.yml -f image_tag=v1.3.5
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Extra raw image tag to apply (release tag to backfill)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/music-assistant-skill

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login only when we push (not on PR)
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Release tags (v1.3.5 / 1.3.5) come from the pushed tag or the
          # published release; latest is added by the action for stable
          # releases only. Branch pushes get edge + sha-… instead, so they
          # never overwrite a release tag.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Build (PR) - no push
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push (push/release/workflow_dispatch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
