name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned for determinism: matches the runtime container's OpenSSL 3.5.x
    # family; setup-python provides 3.14 regardless of the runner image.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/checkout defaults to the merge commit (refs/pull/<n>/merge)
      # on pull_request events, but sonarqube.yml scans workflow_run.head_sha,
      # i.e. the PR head. The two trees only match while the branch is up to
      # date with main: once main moves underneath an open PR the line numbers
      # in the coverage artifact no longer match the scanned files and
      # SonarPython discards the whole report (0.0% coverage on new code).
      # Check out the PR head so the artifact and the scan describe the same
      # tree, and so tests run against exactly what will be squash-merged.
      # Push events have no pull_request payload and fall back to github.sha.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            app/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-test.txt

      # oscrypto 1.3.0 (via ask_sdk_webservice_support -> certvalidator) parses
      # the OpenSSL version with a \d.\d.\d regex that cannot match two-digit
      # patch releases (e.g. 3.0.13 on this runner), failing test collection.
      # Widen the installed copy to \d+.\d+.\d+; the runtime container's
      # OpenSSL 3.5.x has a single-digit patch that the original regex matches,
      # so no container-side patch is needed. Remove once oscrypto ships a
      # fixed release.
      - name: Patch oscrypto OpenSSL version detection
        run: |
          python3 - <<'EOF'
          import pathlib
          for path in pathlib.Path('.venv/lib').glob('python*/site-packages/oscrypto/_openssl/_libcrypto_*.py'):
              text = path.read_text()
              patched = text.replace(r'\\d\\.\\d\\.\\d[a-z]*', r'\\d+\\.\\d+\\.\\d+[a-z]*')
              assert patched != text, path
              path.write_text(patched)
              print('patched', path)
          EOF

      - name: Run tests with coverage
        run: |
          .venv/bin/python -m pytest tests/ \
            --cov \
            --cov-config=.coveragerc \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=65

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
